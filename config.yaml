# Curriculum Training Configuration for SPECTRA
experiment:
  maze_type: "square_corridor"
  exp_name: "curriculum"
  dim: 10
  hidden_dim: 256

rl:
  common:
    gamma: 0.99
    learning_rate: 0.0003
    batch_size: 256
    hidden_size: 256
    num_layers: 3
    polyak: 0.995
    dur: 30
    num_workers: 1
    log_dir: "logs/rl"
    sparse_bonus: 2.0
    success_threshold: 0.15 
    gaussian_bonus: 0.0
    gaussian_std: 0.5
    target_entropy: -1.0
    huber_delta: 1.0        # Lipschitz constraint threshold
    
    logging_keys:
      - "success"
      - "dist_to_goal"
      - "cum_rew_total"
      - "cum_rew_im"
      - "cum_rew_ext"
      - "batch_rew_mean"
      - "avg_q1"
      - "avg_q2"
      - "q1_loss"
      - "q2_loss" 
      - "p_loss"
      - "alpha_loss"
      - "alpha"
      - "rew_pot"
      - "rew_pen"
      - "rew_gauss"
      - "rew_bon"

  static:
    reward_scale: 0.1
    time_penalty: 0.005

  dynamic:
    reward_scale: 1.0      
    time_penalty: 0.05     
    pbrs_gamma: 0.99

  static_huber:
    reward_scale: 0.1
    time_penalty: 0.005

  dynamic_huber:
    reward_scale: 1.0
    time_penalty: 0.05
    pbrs_gamma: 0.99
