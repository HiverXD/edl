# Curriculum Training Configuration for SPECTRA
experiment:
  maze_type: "square_corridor"
  exp_name: "curriculum"
  dim: 10
  hidden_dim: 256

rl:
  common:
    gamma: 0.99
    learning_rate: 0.0003
    batch_size: 256
    hidden_size: 256
    num_layers: 3
    polyak: 0.995
    dur: 50
    num_workers: 1
    log_dir: "logs/rl"
    sparse_bonus: 2.0       # Dominant signal at the very end
    success_threshold: 0.15 
    gaussian_bonus: 0.1     # Smooth guidance near goal (reduced from 5.0)
    gaussian_std: 0.5       # Keep it wide to bridge Potential and Goal
    target_entropy: -1.0    # Keep exploration active
    
    logging_keys:
      - "success"
      - "dist_to_goal"
      - "cum_rew_total"
      - "cum_rew_im"
      - "cum_rew_ext"
      - "batch_rew_mean"
      - "avg_q1"
      - "avg_q2"
      - "q1_loss"
      - "q2_loss" 
      - "p_loss"
      - "alpha_loss"
      - "alpha"
      - "rew_pot"
      - "rew_pen"
      - "rew_gauss"
      - "rew_bon"

  static:
    reward_scale: 0.5      # Pot range [0, -10]. Balanced with Gauss(1.0) and Bonus(2.0)
    time_penalty: 0.01     # Low enough to not discourage moving

  dynamic:
    reward_scale: 1.0      
    time_penalty: 0.05     
    pbrs_gamma: 0.99
