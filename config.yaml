# Curriculum Training Configuration for SPECTRA
experiment:
  maze_type: "square_large"
  exp_name: "curriculum"
  dim: 10
  hidden_dim: 256

stages:
  - id: 1
    name: "coarse_skeleton"
    generation: {grid_size: 0.5, get_skeleton: true, use_random_walk: true, num_episodes: 400}
    training: {epochs: 300, lr: 0.001, resume: false}
  - id: 2
    name: "fine_grid"
    generation: {grid_size: 0.25, get_skeleton: false, use_random_walk: true, num_episodes: 800}
    training: {additional_epochs: 200, lr: 0.001, resume: true}

vqvae: # (VQ-VAE logic kept for ablation)
  mode: "commute"
  num_samples: 50000 
  log_dir: "logs/vqvae"
  hidden_size: 128
  codebook_size: 10 
  code_size: 16     
  learning_rate: 0.001
  batch_size: 1024
  epochs: 500
  normalize_inputs: false

rl:
  common: # Shared parameters
    gamma: 0.99
    learning_rate: 0.0003
    batch_size: 256
    hidden_size: 256
    num_layers: 3
    polyak: 0.995
    dur: 50
    num_workers: 1
    log_dir: "logs/rl"
    sparse_bonus: 20.0      
    success_threshold: 0.15 # Matched with MazeEnv dist_threshold
    gaussian_bonus: 5.0     # Strengthened for better local guidance
    gaussian_std: 4.0       # Made sharper to match dist_threshold
    
    logging_keys:
      - "success"
      - "dist_to_goal"
      - "cum_rew_total"
      - "cum_rew_im"
      - "cum_rew_ext"
      - "batch_rew_mean"
      - "avg_q1"
      - "avg_q2"
      - "q1_loss"
      - "q2_loss" 
      - "p_loss"
      - "alpha_loss"
      - "alpha"
      - "rew_pot"
      - "rew_pen"
      - "rew_gauss"
      - "rew_bon"

  static:
    reward_scale: 0.01      
    time_penalty: 0.001     

  dynamic:
    reward_scale: 0.1      
    time_penalty: 0.01     
    pbrs_gamma: 0.99